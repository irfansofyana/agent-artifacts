<script>
const lessons=[
{id:'map',n:'00',title:'Map the ecosystem',time:'35 min',domain:'Orientation',summary:'Know what belongs to LangChain, LangGraph, Deep Agents, and LangSmith—and where abstraction should stop.',sections:[
['The one-minute model',`<p><strong>LangChain</strong> gives you agent building blocks and a standard agent loop. <strong>LangGraph</strong> is the lower-level orchestration/runtime for explicit stateful workflows. <strong>Deep Agents</strong> is a batteries-included harness for long-running, tool-heavy work. <strong>LangSmith</strong> covers observability, evaluation, deployment, and production improvement.</p><div class="note"><strong>Decision rule:</strong> start with <code>create_agent</code>. Move to an explicit LangGraph when topology and state transitions are the product. Reach for Deep Agents when planning, files, skills, subagents, and context compression are recurring needs—not because “multi-agent” sounds advanced.</div>`],
['Abstraction ladder',`<div class="diagram"><div class="layer" data-layer="PRODUCT">Your domain workflow, UX, permissions, and success criteria</div><div class="layer" data-layer="HARNESS">Deep Agents: planning, files, skills, subagents, summarization</div><div class="layer" data-layer="AGENT API">LangChain: create_agent, tools, middleware, structured output</div><div class="layer" data-layer="RUNTIME">LangGraph: state, nodes, edges, checkpoints, interrupts, durable execution</div><div class="layer" data-layer="LIFECYCLE">LangSmith: traces, datasets, experiments, deployment, online evaluation</div></div>`],
['Anti-patterns',`<ul><li>Starting with a swarm of agents before one well-instrumented agent works.</li><li>Treating a vector store as “memory” without a retrieval contract.</li><li>Using prompts to enforce permissions that must be enforced in code.</li><li>Optimizing model choice before you have traces and a representative dataset.</li><li>Shipping a demo loop without retries, idempotency, sandboxing, or human approval.</li></ul>`]]},
{id:'build',n:'01',title:'Build agents deliberately',time:'2.5 h',domain:'Build · 25%',summary:'Tools, middleware, context, output schemas, state, and the create_agent loop.',sections:[
['The agent loop',`<p>An agent repeatedly asks a model what to do, executes selected tools, feeds results back, and stops when it produces a final response. Reliability comes from constraining each boundary.</p><pre class="code"><button class="copy">Copy</button>from langchain.agents import create_agent
from langchain.tools import tool

@tool
def lookup_policy(topic: str) -> str:
    """Return the approved policy excerpt for a topic."""
    return policy_index.search(topic)

agent = create_agent(
    model="openai:gpt-5.2",
    tools=[lookup_policy],
    system_prompt="Cite policy IDs. Never invent missing policy.",
)
result = agent.invoke({"messages": [
    {"role": "user", "content": "What is our refund window?"}
]})</pre>`],
['Design tools as APIs',`<ul><li><strong>Narrow contract:</strong> one clear job, typed arguments, useful docstring.</li><li><strong>Small output:</strong> return structured, relevant data—not a 50,000-token dump.</li><li><strong>Enforced authorization:</strong> verify identity and scope inside the tool.</li><li><strong>Safe side effects:</strong> separate read, propose, and commit; make writes idempotent.</li><li><strong>Useful errors:</strong> distinguish invalid input, denied access, transient failure, and not found.</li></ul>`],
['Middleware is the harness seam',`<p>Middleware can intercept model calls, tool calls, and lifecycle events. Use it for policies that must apply consistently: logging, retries, model routing, tool filtering, summarization, PII handling, or human approval.</p><div class="note"><strong>Exam anchor:</strong> middleware changes behavior around the loop; tools expand what the loop can do; state/context changes what it knows.</div>`],
['Context engineering',`<p>Context is a budget, not a bucket. Shape four inputs deliberately:</p><ol><li><strong>Instructions:</strong> stable system rules and dynamic situation-specific guidance.</li><li><strong>Knowledge:</strong> retrieved evidence, files, memory, and skills.</li><li><strong>Actions:</strong> only tools currently relevant and authorized.</li><li><strong>History:</strong> messages, summaries, and state needed for the next decision.</li></ol><p>Prefer deterministic filtering before clever prompting. Summarize old interactions, offload large artifacts to files, and retrieve on demand.</p>`],
['Structured output and state',`<p>Use structured output when downstream code needs a contract. Treat conversation messages as one part of state, not the whole state. State can also carry user identity, approval status, routing decisions, retrieved evidence IDs, budgets, and retry counters.</p><pre class="code"><button class="copy">Copy</button>from pydantic import BaseModel, Field

class Decision(BaseModel):
    action: str = Field(description="approve, reject, or escalate")
    reason: str
    evidence_ids: list[str]

agent = create_agent(model=model, tools=tools,
                     response_format=Decision)</pre>`]]},
{id:'graph',n:'02',title:'Orchestrate with LangGraph',time:'2 h',domain:'Build support',summary:'State graphs, persistence, interrupts, durable execution, and workflow-vs-agent choices.',sections:[
['Graph anatomy',`<p>A <strong>node</strong> reads state and returns updates. An <strong>edge</strong> controls what runs next. Conditional edges route by state. Reducers define how concurrent updates merge.</p><pre class="code"><button class="copy">Copy</button>from typing import TypedDict, Literal
from langgraph.graph import StateGraph, START, END

class State(TypedDict):
    request: str
    risk: Literal["low", "high"]
    result: str

def classify(state): ...
def execute(state): ...
def request_approval(state): ...

g = StateGraph(State)
g.add_node("classify", classify)
g.add_node("execute", execute)
g.add_node("approval", request_approval)
g.add_edge(START, "classify")
g.add_conditional_edges("classify", lambda s: s["risk"],
                        {"low": "execute", "high": "approval"})
g.add_edge("execute", END)</pre>`],
['Persistence and threads',`<p>A checkpointer saves graph state at boundaries. A <strong>thread ID</strong> identifies a persistent execution history. This enables multi-turn state, inspection, time travel, recovery, and interrupts. In production, use a durable checkpointer—not in-memory storage.</p>`],
['Interrupts and human control',`<p><code>interrupt()</code> pauses execution, persists state, and returns an approval payload. Resume with a command. The node may restart from its beginning, so side effects before an interrupt must be idempotent or moved after approval.</p><div class="note warning"><strong>Failure mode:</strong> charging a card and then interrupting can charge twice on resume. Propose → approve → commit, with an idempotency key.</div>`],
['Durable execution discipline',`<ul><li>Wrap non-deterministic operations as tasks or nodes whose results are persisted.</li><li>Use idempotent side effects and stable identifiers.</li><li>Do not assume local variables survive restart; persist required values in state.</li><li>Choose durability mode based on failure tolerance and latency needs.</li></ul>`],
['Workflow or agent?',`<table><tr><th>Use deterministic workflow when…</th><th>Use an agent when…</th></tr><tr><td>Steps and branching are known, compliance needs explicit paths, or latency must be predictable.</td><td>The path depends on open-ended evidence, tool selection, or iterative reasoning.</td></tr></table><p>Strong systems mix both: deterministic outer workflow, agentic nodes where judgment earns its cost.</p>`]]},
{id:'deep',n:'03',title:'Engineer Deep Agents',time:'2.5 h',domain:'Build · 25%',summary:'Harnesses, planning, virtual filesystems, skills, subagents, sandboxes, and long-context control.',sections:[
['Why a harness exists',`<p>A production agent needs more than a tool loop. Deep Agents packages recurring harness capabilities: planning, filesystem access, subagents, skills/memory, and context management. That lets the product team spend its effort on domain-specific workflows and safety.</p>`],
['create_agent vs create_deep_agent',`<ul><li><strong>create_agent:</strong> minimal, composable default. Add only the middleware you need.</li><li><strong>create_deep_agent:</strong> opinionated harness for long-running, multi-step tasks that benefit from plans, files, skills, and delegation.</li></ul><div class="note"><strong>Use the lightest abstraction that survives your workload.</strong> Deep Agents is not “better”; it is more preassembled.</div>`],
['Files as working memory',`<p>Files give the model an inspectable, editable workspace and keep large artifacts out of the immediate message history. Backends define where those files live: ephemeral state, persistent storage, or a composite that routes paths differently.</p><p>For cloud execution, materialize relevant files into a sandbox before code runs, then sync changed files back. Keep the sandbox least-privilege, time-limited, network-restricted, and isolated per tenant/session.</p>`],
['AGENTS.md, memory, and SKILL.md',`<p><strong>AGENTS.md</strong> holds concise, always-relevant instructions or memory. <strong>SKILL.md</strong> packages task-specific procedures that should load only when needed. Tools provide capabilities; skills teach the procedure for using them.</p><ul><li>Keep always-loaded memory small and stable.</li><li>Write skills with triggers, steps, pitfalls, and verification.</li><li>Version and review skills like code—because they change behavior.</li></ul>`],
['Subagents without theater',`<p>Delegate when isolation or parallelism improves the result: independent research, context-heavy analysis, or specialist tasks. Keep the main agent focused on coordination. Do not delegate a single cheap tool call or create agents that only relay messages.</p>`],
['Compression',`<p>Long sessions degrade when every historical detail competes for attention. Use summarization and offloading before the context limit. Preserve commitments, unresolved questions, identifiers, and evidence pointers; discard duplicated prose and obsolete intermediate reasoning.</p>`]]},
{id:'test',n:'04',title:'Test agents scientifically',time:'3 h',domain:'Test · 25%',summary:'Datasets, evaluators, experiments, alignment, and a production-shaped improvement loop.',sections:[
['The evaluation loop',`<ol><li>Inspect real traces and name a failure taxonomy.</li><li>Create a dataset of representative and adversarial examples.</li><li>Define evaluators tied to user-visible success.</li><li>Run a baseline experiment.</li><li>Change one meaningful variable.</li><li>Compare results, inspect slices, then ship behind monitoring.</li></ol>`],
['Evaluator choice',`<table><tr><th>Evaluator</th><th>Best for</th><th>Risk</th></tr><tr><td>Code/rule</td><td>Schema, exact facts, tool use, latency, cost</td><td>Misses semantic quality</td></tr><tr><td>Reference-based</td><td>Known-answer correctness</td><td>Reference may be incomplete</td></tr><tr><td>LLM-as-judge</td><td>Nuance, style, groundedness</td><td>Bias, variance, cost</td></tr><tr><td>Human</td><td>Gold labels, preference, policy</td><td>Slow and inconsistent</td></tr><tr><td>Trajectory</td><td>Agent path/tool decisions</td><td>Over-constraining valid paths</td></tr></table><p>Combine them. A beautiful answer that called an unauthorized tool is still a failure.</p>`],
['Offline vs online',`<p><strong>Offline</strong> evaluation runs experiments on a controlled dataset before release. <strong>Online</strong> evaluation scores sampled production runs or threads without known references, using safety checks, heuristics, sentiment, or reference-free judges.</p>`],
['Evaluator alignment',`<p>Before trusting a judge, compare its labels with expert human labels across positive, negative, ambiguous, and adversarial cases. Measure disagreement; revise rubric and examples. Never optimize an agent against an unvalidated judge.</p>`],
['Avoid false confidence',`<ul><li>Report confidence intervals or sample counts, not just averages.</li><li>Slice by task type, user group, model, tool, language, and failure mode.</li><li>Keep a holdout set to resist prompt overfitting.</li><li>Track quality together with cost and latency.</li><li>Add production failures back into the dataset after review.</li></ul>`]]},
{id:'deploy',n:'05',title:'Deploy with control',time:'2 h',domain:'Deploy · 25%',summary:'Deployment primitives, isolation, secrets, auth, durability, and safe releases.',sections:[
['The six nouns',`<dl class="term"><dt>Graph</dt><dd>Compiled application logic.</dd></dl><dl class="term"><dt>Deployment</dt><dd>Hosted environment serving one or more graphs.</dd></dl><dl class="term"><dt>Revision</dt><dd>Versioned deployment configuration/code release.</dd></dl><dl class="term"><dt>Assistant</dt><dd>A graph plus configurable behavior/context.</dd></dl><dl class="term"><dt>Thread</dt><dd>Persistent state container across runs.</dd></dl><dl class="term"><dt>Run</dt><dd>One execution workload against an assistant, optionally on a thread.</dd></dl>`],
['Authentication is not authorization',`<p><strong>Authentication</strong> establishes who the caller is. <strong>Authorization</strong> determines which resources and actions that identity may access. Pass trusted identity into runtime context and enforce tenant/resource checks in code and tools.</p>`],
['Secrets and isolation',`<ul><li>Store secrets in the deployment secret manager; never state, prompts, logs, or source.</li><li>Separate tenant data at storage and tool boundaries.</li><li>Scope runtime credentials to the minimum operations.</li><li>Redact sensitive values before tracing.</li><li>Use isolated sandboxes for generated code and untrusted files.</li></ul>`],
['Safe release model',`<p>Deploy a new revision, run smoke/evaluation gates, route a small traffic slice, watch quality/latency/cost/errors, then promote or roll back. Multi-region improves availability and latency but adds state placement, replication, data residency, and failover decisions.</p>`],
['Storage durability',`<p>Durability is a product requirement, not a toggle. Decide which state survives process restart, region failure, and deployment replacement: checkpoints, long-term store, files/artifacts, and audit records may have different retention and consistency needs.</p>`]]},
{id:'monitor',n:'06',title:'Monitor and improve',time:'2 h',domain:'Monitor · 25%',summary:'Traces, threads, costs, sentiment, online evals, Insights, alerts, and incident signals.',sections:[
['Read traces top-down',`<ol><li>Start with the root run: outcome, latency, total tokens/cost, error.</li><li>Find the slowest or failed child span.</li><li>Inspect model inputs, tool arguments/results, retries, and state transitions.</li><li>Compare with neighboring traces and thread history.</li><li>Classify root cause: model, prompt/context, tool, data, policy, infrastructure, or UX.</li></ol>`],
['Trace vs thread',`<p>A <strong>trace</strong> is one execution tree of runs. A <strong>thread</strong> groups related executions in a stateful conversation. Single-turn quality can look fine while thread-level behavior drifts, repeats work, or loses commitments.</p>`],
['Insights, online evals, alerts',`<ul><li><strong>Online evaluators:</strong> continuously score sampled production runs/threads.</li><li><strong>Insights:</strong> discover recurring patterns, topics, and failure clusters from sampled traffic.</li><li><strong>Alerts:</strong> notify when operational or quality thresholds are crossed.</li></ul><p>Use Insights to discover; evaluators to measure; alerts to react.</p>`],
['Production scorecard',`<ul><li><strong>Quality:</strong> task success, groundedness, policy compliance, user feedback.</li><li><strong>Reliability:</strong> errors, retries, tool failures, abandonment.</li><li><strong>Performance:</strong> p50/p95 latency, time-to-first-token.</li><li><strong>Economics:</strong> tokens, model/tool cost per successful task.</li><li><strong>Adoption:</strong> retained users and completed workflows—not message volume.</li></ul>`],
['Alert design',`<p>Alert on actionable symptoms with ownership and a runbook: error-rate spikes, latency SLO burn, cost anomalies, safety-evaluator failures, or a drop in task success. Avoid noisy alerts with no response path.</p>`]]},
{id:'stripe',n:'07',title:'Stripe Kai case study',time:'3 h',domain:'Capstone',summary:'Reverse-engineer the layered Deep Agents platform and build a smaller, safer version.',sections:[
['What Stripe optimized for',`<p>Kai was designed as a context-aware AI coworker for employees—especially non-engineers—inside a session UI. It connects to internal sources, produces evolving artifacts, and comes preloaded with company context through tools and skills.</p><p>The strategic move was not “use a smarter model.” It was to provide a production harness and domain interface so users did not need terminals, configuration knobs, or repeated company explanations.</p>`],
['The four-layer architecture',`<div class="diagram"><div class="layer" data-layer="4 · PRODUCT">Session UI: conversation plus evolving reports, dashboards, and documents</div><div class="layer" data-layer="3 · CUSTOM AGENTS">Specialized skill sets, behavior, and personas configured by teams</div><div class="layer" data-layer="2 · STRIPE PLATFORM">Security posture, internal infrastructure, data warehouse, Slack, Google Suite</div><div class="layer" data-layer="1 · DEEP AGENTS">Tool loop, middleware, streaming, state, files, sandboxing, compression</div></div>`],
['Production patterns',`<ul><li><strong>Virtual filesystem:</strong> S3-backed persistent session files.</li><li><strong>Sync in / sync out:</strong> materialize files into a sandbox before execution; synchronize modifications afterward.</li><li><strong>Sandbox as a tool:</strong> keep orchestration and identity outside the replaceable environment that runs generated code; expose only scoped files and operations.</li><li><strong>Long-session context:</strong> tune summarization/offloading to preserve quality and cost.</li><li><strong>Skills at organizational scale:</strong> domain experts package reusable procedures rather than hard-coding every workflow; pin essential policy and load specialized skills dynamically.</li><li><strong>Role defaults plus user overlays:</strong> start with relevant company context, then let users extend it without modifying the common harness.</li></ul>`],
['Why it worked',`<p>Deep Agents handled the generic harness problems while Stripe focused on “Stripey” problems: security, data, workflows, knowledge, and UX. The team reported building the initial version in one week and rapidly exceeding adoption goals. Treat those as a case-study outcome, not a universal delivery estimate.</p>`],
['Your capstone brief',`<p>Build a <strong>Knowledge Workbench</strong> for one narrow domain (for example, internal engineering standards). It must answer with citations, draft an artifact, and require approval before publishing.</p><ol><li>Define users, one workflow, and measurable success.</li><li>Create three read-only tools with enforced access scopes.</li><li>Add a virtual workspace with explicit retention.</li><li>Package two skills written by domain experts.</li><li>Sandbox one analysis task with no network by default.</li><li>Create 20 eval examples: 10 normal, 5 edge, 5 adversarial.</li><li>Add traces, quality/cost evaluators, and one actionable alert.</li><li>Threat-model data exfiltration, prompt injection, confused deputy, and cross-tenant access.</li></ol>`]]}

function lesson(x){return `<div class="view active"><div class="lesson-head"><div><div class="kicker">Module ${x.n} · ${x.domain}</div><h2>${x.title}</h2><p class="lede">${x.summary}</p></div><button class="btn ${state.done[x.id]?'good':''}" id="completeLesson">${state.done[x.id]?'✓ Completed':'Mark complete'}</button></div><div class="lesson-content"><div class="lesson-body">${x.sections.map((s,i)=>`<section id="s${i}"><h3>${s[0]}</h3>${s[1]}</section>`).join('')}<section class="card"><h3>Retrieval check</h3><p>Close this section and explain the module aloud in two minutes. Then answer:</p><ul><li>What decision does this concept help you make?</li><li>What failure mode does it prevent?</li><li>Where would you enforce it—in prompt, state, middleware, tool, graph, or infrastructure?</li></ul></section></div><aside class="toc card"><div class="eyebrow">In this module</div><ul>${x.sections.map((s,i)=>`<li><a href="#s${i}">${s[0]}</a></li>`).join('')}</ul><div class="actions"><button class="btn secondary" data-go="flash">Review cards</button></div></aside></div></div>`}
function flash(){const unseen=flashcards.map((_,i)=>i).filter(i=>!state.flash[i]);const i=Number(sessionStorage.flashIndex??(unseen[0]??0));const c=flashcards[i];return `<div class="view active"><div class="kicker">Active recall · ${Object.keys(state.flash).length}/${flashcards.length} known</div><h2>Flashcards</h2><div class="flash-stage"><div class="flashcard" id="flashcard"><div class="flash-meta">${c[0]} · Card ${i+1} of ${flashcards.length}</div><div class="prompt"><h3>${c[1]}</h3><p class="muted">Say your answer before revealing it.</p></div><div class="answer">${c[2]}</div><div class="actions"><button class="btn" id="reveal">Reveal answer</button><button class="btn secondary" id="again" hidden>Again</button><button class="btn good" id="known" hidden>Got it</button></div></div></div></div>`}
function examIntro(){return `<div class="view active"><div class="hero"><div><div class="kicker">Original practice questions · not exam dumps</div><h2>40 questions. Four domains. No hiding.</h2><p class="lede">Use diagnostic mode for explanations after each answer, or simulation mode for a 120-minute timed run. The bank is aligned to the published exam guide but contains original questions.</p><div class="actions"><button class="btn" id="diagnostic">Start diagnostic</button><button class="btn secondary" id="simulation">Start timed simulation</button></div></div><aside class="stamp"><strong>28 / 40</strong><p>Official pass threshold. My recommendation: score ≥32 twice, with no domain below 7/10.</p></aside></div><div class="grid"><div class="card span6"><h3>Allowed in the real exam</h3><p>LangSmith, LangChain Docs, and LangChain Academy. The exam is semi-open-book and uses a dedicated LangSmith organization.</p></div><div class="card span6"><h3>Not allowed in the real exam</h3><p>General web search, AI assistants, browser automation, second screens, outside communication, notes, or scratch paper. Verify current rules in the official guide before booking.</p></div></div></div>`}
let exam={i:0,answers:{},mode:'diagnostic',start:0,finished:false};let timerId;
function startExam(mode){exam={i:0,answers:{},mode,start:Date.now(),finished:false};renderExam()}
function renderExam(){clearInterval(timerId);const m=document.getElementById('main'),q=questions[exam.i];m.innerHTML=`<div class="view active quiz-shell"><div class="quiz-top"><div><div class="kicker">${exam.mode==='simulation'?'Timed simulation':'Diagnostic'} · ${q.d}</div><strong>Question ${exam.i+1} / 40</strong></div><div class="timer" id="timer">${exam.mode==='simulation'?'120:00':'Untimed'}</div></div><div class="question"><h3>${q.q}</h3><div class="options">${q.o.map((o,i)=>`<button class="option ${exam.answers[exam.i]===i?'selected':''}" data-answer="${i}"><strong>${String.fromCharCode(65+i)}.</strong><span>${o}</span></button>`).join('')}</div>${exam.mode==='diagnostic'&&exam.answers[exam.i]!=null?`<div class="note ${exam.answers[exam.i]===q.a?'':'warning'}" style="margin-top:15px"><strong>${exam.answers[exam.i]===q.a?'Correct.':'Not quite.'}</strong> ${q.e}</div>`:''}</div><div class="qnav">${questions.map((_,i)=>`<button data-q="${i}" class="${exam.answers[i]!=null?'done':''} ${exam.i===i?'current':''}" aria-label="Question ${i+1}">${i+1}</button>`).join('')}</div><div class="actions"><button class="btn secondary" id="prev" ${exam.i===0?'disabled':''}>Previous</button><button class="btn" id="next">${exam.i===39?'Finish':'Next'}</button><button class="btn secondary" id="finish">Finish now</button></div></div>`;wireExam();if(exam.mode==='simulation'){tick();timerId=setInterval(tick,1000)}}
function tick(){const left=Math.max(0,7200-Math.floor((Date.now()-exam.start)/1000));const el=document.getElementById('timer');if(el)el.textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');if(!left)finishExam()}
function finishExam(){clearInterval(timerId);const by={Build:[0,0],Test:[0,0],Deploy:[0,0],Monitor:[0,0]};questions.forEach((q,i)=>{by[q.d][1]++;if(exam.answers[i]===q.a)by[q.d][0]++});const score=Object.values(by).reduce((n,x)=>n+x[0],0);state.lastExam={score,by,at:new Date().toISOString()};save();document.getElementById('main').innerHTML=`<div class="view active"><div class="kicker">Practice result</div><h2>${score>=28?'Pass line cleared.':'Not ready yet—and now you know where.'}</h2><p class="lede"><strong>${score}/40 · ${Math.round(score/40*100)}%</strong>. Aim for 32+ twice before paying for the exam.</p><div class="result-grid">${Object.entries(by).map(([d,v])=>`<div class="domain-score"><div class="metric">${v[0]}/${v[1]}</div><strong>${d}</strong><div class="bar" style="margin-top:10px"><span style="width:${v[0]/v[1]*100}%"></span></div></div>`).join('')}</div><div class="actions"><button class="btn" data-go="exam">Try again</button><button class="btn secondary" data-go="path">Review curriculum</button></div><div class="card" style="margin-top:25px"><h3>Readiness rule</h3><p>Do not study every domain equally. Review any domain below 8/10, rebuild its capstone evidence, then retest. A lucky aggregate pass is fragile.</p></div></div>`;wire('result')}
const tasks=['Write a one-page product brief with one user and one measurable workflow','Draw the four-layer architecture and trust boundaries','Implement three narrow read-only tools with scoped authorization','Add a virtual workspace and retention policy','Create two task-specific skills with verification steps','Add human approval before the first write action','Build a 20-example dataset across normal, edge, and adversarial cases','Run a baseline and one-variable comparative experiment','Add trace metadata for tenant, workflow, model, and release','Define one quality alert, one cost alert, and their runbooks','Threat-model prompt injection, exfiltration, confused deputy, and cross-tenant access','Record a 5-minute architecture walkthrough from memory'];
function capstone(){return `<div class="view active"><div class="kicker">Production-shaped practice</div><h2>Build a smaller Kai.</h2><p class="lede">One useful workflow, narrow access, persistent artifacts, measurable quality. Not a generic “chat with documents” wrapper.</p><div class="grid"><div class="card span8"><h3>Definition of done</h3><div class="task-list">${tasks.map((t,i)=>`<label class="task"><input type="checkbox" data-task="${i}" ${state.tasks[i]?'checked':''}><span>${t}</span></label>`).join('')}</div></div><div class="card span4"><h3>Architecture constraints</h3><ul><li>Read-only by default</li><li>Explicit identity and tenant scope</li><li>No broad host mount</li><li>Sandboxed execution</li><li>Citations to source IDs</li><li>Approval before writes</li><li>Versioned skills</li><li>Traces with sensitive-data redaction</li></ul></div><div class="card span12"><h3>Demo script</h3><ol><li>Ask a question requiring two internal sources.</li><li>Show tool selection and cited evidence.</li><li>Create an editable artifact in the workspace.</li><li>Attempt an unauthorized source and show denial.</li><li>Propose a write and interrupt for approval.</li><li>Inspect the trace and evaluator result.</li><li>Resume after simulated failure without duplicating the write.</li></ol></div></div></div>`}
function glossaryView(filter=''){const xs=glossary.filter(x=>x.join(' ').toLowerCase().includes(filter.toLowerCase()));return `<div class="view active"><div class="kicker">Language shapes decisions</div><h2>Glossary</h2><div class="glossary-tools"><input class="search" id="termSearch" value="${filter}" placeholder="Filter terms…" aria-label="Filter glossary"></div><dl>${xs.map(x=>`<div class="term"><dt>${x[0]}</dt><dd>${x[1]}</dd></div>`).join('')}</dl></div>`}
function sourcesView(){return `<div class="view active"><div class="kicker">Official-first references</div><h2>Sources & 4-week plan</h2><p class="lede">The framework moves quickly. Use this fieldbook for structure; use official docs for current APIs and exam rules.</p><div class="roadmap"><div class="week"><strong>WEEK 1 · BUILD</strong><h4>Agent foundations</h4><p>Modules 00–02. Complete the official LangChain course. Ship a traced single-agent prototype.</p></div><div class="week"><strong>WEEK 2 · HARNESS</strong><h4>Deep Agents</h4><p>Module 03 and official Deep Agents course. Add files, one skill, and approval.</p></div><div class="week"><strong>WEEK 3 · LIFECYCLE</strong><h4>Test + deploy</h4><p>Modules 04–05 and official courses. Build dataset, compare experiment, stage release.</p></div><div class="week"><strong>WEEK 4 · OPERATE</strong><h4>Monitor + certify</h4><p>Modules 06–07. Complete capstone, score 32+ twice, then book.</p></div></div><h3 style="margin-top:38px">Primary sources</h3><div class="source-list">${sources.map(x=>`<div class="source"><a href="${x[1]}" target="_blank" rel="noopener">${x[0]} ↗</a><div class="muted small">${x[2]}</div></div>`).join('')}</div><div class="card" style="margin-top:25px"><h3>Progress portability</h3><p>Everything is stored in your browser’s localStorage. Export a backup before moving to another device or publishing under a new URL.</p><div class="actions"><button class="btn" id="exportState">Export progress</button><label class="btn secondary" for="importState">Import progress</label><input id="importState" type="file" accept="application/json" hidden><button class="btn secondary" id="resetState">Reset</button></div></div></div>`}
function wire(id){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>show(b.dataset.go));document.querySelectorAll('.module').forEach(el=>el.onclick=()=>show(el.querySelector('[data-go]').dataset.go));document.querySelectorAll('.copy').forEach(b=>b.onclick=async()=>{await navigator.clipboard.writeText(b.parentElement.textContent.replace('Copy','').trim());toast('Code copied')});if(id&&lessons.some(x=>x.id===id)){document.getElementById('completeLesson').onclick=()=>{state.done[id]=!state.done[id];save();render(id)}}if(id==='flash'){const i=Number(sessionStorage.flashIndex||0),card=document.getElementById('flashcard'),reveal=document.getElementById('reveal'),again=document.getElementById('again'),known=document.getElementById('known');reveal.onclick=()=>{card.classList.add('revealed');reveal.hidden=true;again.hidden=known.hidden=false};const next=(ok)=>{if(ok)state.flash[i]=true;else delete state.flash[i];save();sessionStorage.flashIndex=(i+1)%flashcards.length;render('flash')};again.onclick=()=>next(false);known.onclick=()=>next(true)}if(id==='exam'){document.getElementById('diagnostic').onclick=()=>startExam('diagnostic');document.getElementById('simulation').onclick=()=>startExam('simulation')}if(id==='capstone')document.querySelectorAll('[data-task]').forEach(c=>c.onchange=()=>{state.tasks[c.dataset.task]=c.checked;save()});if(id==='glossary')document.getElementById('termSearch').oninput=e=>{const pos=e.target.selectionStart;document.getElementById('main').innerHTML=glossaryView(e.target.value);wire('glossary');const n=document.getElementById('termSearch');n.focus();n.setSelectionRange(pos,pos)};if(id==='sources'){document.getElementById('exportState').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='agent-fieldbook-progress.json';a.click();URL.revokeObjectURL(a.href)};document.getElementById('importState').onchange=e=>{const r=new FileReader();r.onload=()=>{try{const v=JSON.parse(r.result);if(!v||typeof v!=='object')throw Error();Object.assign(state,v);save();toast('Progress imported');render('sources')}catch{toast('Invalid progress file')}};r.readAsText(e.target.files[0])};document.getElementById('resetState').onclick=()=>{if(confirm('Reset all local progress?')){localStorage.removeItem('agentFieldbookState');location.reload()}}}}
function wireExam(){document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{exam.answers[exam.i]=Number(b.dataset.answer);renderExam()});document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{exam.i=Number(b.dataset.q);renderExam()});document.getElementById('prev').onclick=()=>{exam.i--;renderExam()};document.getElementById('next').onclick=()=>{if(exam.i===39)finishExam();else{exam.i++;renderExam()}};document.getElementById('finish').onclick=()=>finishExam()}
initNav();show('home');updateProgress();
</script>
</body>
</html>
